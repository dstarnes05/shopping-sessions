name: Native record layout and aggregation benchmark
on:
  push:
    branches: [codex/record-benchmark]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: cpu
        run: |
          lscpu
          if grep -q GenuineIntel /proc/cpuinfo; then echo 'intel=yes' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.intel == 'yes'
        with:
          fetch-depth: 0
      - if: steps.cpu.outputs.intel == 'yes'
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
          python -m pip install polars==2.1.0
          cargo build --release --locked --manifest-path bench/gen/Cargo.toml
          bash bench/run.sh
