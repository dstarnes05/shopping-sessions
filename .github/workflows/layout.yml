name: Measure compact event records
on:
  push:
    branches: [codex/layout-benchmark]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fc28af217a51606b4f8c839789b623313f137ca6
          path: candidate
      - working-directory: candidate
        run: |
          lscpu
          grep -qw avx512_vnni /proc/cpuinfo
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
          python -m pip install polars==2.1.0
          bash ../bench/compact/run.sh
