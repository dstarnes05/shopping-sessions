name: Intel candidate confirmation
on:
  push:
    branches: [codex/parser-diagnostics]
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - id: cpu
        run: |
          lscpu
          if grep -q GenuineIntel /proc/cpuinfo; then echo 'intel=yes' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.intel == 'yes'
      - if: steps.cpu.outputs.intel == 'yes'
        run: |
          set -eu
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
          python -m pip install polars
          cargo build --release --manifest-path bench/gen/Cargo.toml
          cargo build --release --locked
          cp target/release/shopping-sessions /tmp/base
          for v in parser radix click time; do git apply bench/$v.patch; done
          cargo build --release --locked
          cp target/release/shopping-sessions /tmp/best
          export NCPU="$(nproc)" DATA_DIR=/tmp/input
          for seed in 42 98 99; do
            size=20000000; if [ "$seed" = 99 ]; then size=60000000; fi
            bench/gen/target/release/generate --seed "$seed" --events "$size" --clicks "$((size/4))" --output "$DATA_DIR"
            OUTPUT_DIR=/tmp/out-base /tmp/base
            for v in base best best base base best; do
              OUTPUT_DIR="/tmp/out-$v" /usr/bin/time -f "INTEL $seed $v %e %M" "/tmp/$v"
            done
            python scripts/compare.py /tmp/out-base /tmp/out-best
            rm -rf /tmp/input /tmp/out-base /tmp/out-best
          done
